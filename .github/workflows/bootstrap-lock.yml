name: Bootstrap dependency lock
on:
  push:
    branches: [feat/frontend-latex-verification]
    paths: ['.github/workflows/bootstrap-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    if: github.repository == 'Microck/syntaxis-frontend' && github.ref == 'refs/heads/feat/frontend-latex-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-latex-verification
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock dependencies and preserve native navigation
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = ['components/syntaxis/brand.tsx','components/syntaxis/landing.tsx','components/syntaxis/workspace.tsx'];
          for (const file of files) {
            const source = readFileSync(file, 'utf8');
            if (!source.includes("from 'next/link'")) throw new Error('Unexpected navigation import: ' + file);
            writeFileSync(file, source.replace("from 'next/link'", "from '@/components/syntaxis/navigation-link'"));
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json components/syntaxis/brand.tsx components/syntaxis/landing.tsx components/syntaxis/workspace.tsx
          git commit -m 'fix: retain native navigation and lock verified dependencies'
          git push origin HEAD:feat/frontend-latex-verification
