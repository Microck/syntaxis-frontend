name: Frontend verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install build-time template support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Core behavior
        if: ${{ !cancelled() }}
        run: npm run test:core
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the production Worker and browser UI
        run: |
          npm start > /tmp/syntaxis-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 2
          done
          npm run test:routes
          npm run test:browser
      - name: Deterministic tester-army browser flows
        run: |
          npx e2e-web install chromium --with-deps
          npm run test:e2e
      - name: Server diagnostics
        if: always()
        run: cat /tmp/syntaxis-server.log || true
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syntaxis-frontend-evidence
          path: |
            browser-evidence/
            .e2e/results/
          include-hidden-files: true
          retention-days: 14
  native-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install native TeX tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile and inspect 39 PDF fixtures
        run: npm run test:latex
