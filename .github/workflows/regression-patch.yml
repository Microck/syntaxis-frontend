name: Apply targeted regression fixes
on:
  push:
    branches: [feat/frontend-latex-verification]
    paths: ['.github/workflows/regression-patch.yml']
permissions:
  contents: read
jobs:
  patch:
    if: github.repository == 'Microck/syntaxis-frontend' && github.ref == 'refs/heads/feat/frontend-latex-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-latex-verification
      - name: Apply exact reviewed replacements, then remove this one-time workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, f'Non-unique replacement in {path}'
              p.write_text(text.replace(old, new))
          replace('components/syntaxis/workspace.tsx', "import Link from '@/components/syntaxis/navigation-link';", "import Link from '@/components/syntaxis/navigation-link';\nimport { flushSync } from 'react-dom';")
          replace('components/syntaxis/workspace.tsx', "const printResume = () => { const old = document.title;", "const printResume = () => { flushSync(() => setShowPdf(false)); const old = document.title;")
          replace('scripts/verify-browser.mjs', "await page.evaluate(()=>document.fonts.ready);await assertNoOverflow(page);await capture('landing-desktop');", "await page.evaluate(()=>document.fonts.ready);\n  await page.waitForFunction(()=>document.querySelector('[data-decode-text]')?.textContent==='Well told.' && Number(getComputedStyle(document.querySelector('.hero-description')).opacity)>.99 && Number(getComputedStyle(document.querySelector('.paper-front')).opacity)>.99);\n  await assertNoOverflow(page);await page.screenshot({path:'browser-evidence/landing-desktop.png'});\n  await page.emulateMedia({reducedMotion:'reduce'});\n  await page.waitForFunction(()=>[...document.querySelectorAll('[data-reveal]')].every(el=>Number(getComputedStyle(el).opacity)>.99));\n  await capture('landing-full-reduced-motion');")
          replace('scripts/verify-browser.mjs', "await capture('workspace-compiled-pdf');", "await capture('workspace-compiled-pdf');\n  await page.evaluate(()=>{window.print=()=>{window.__printText=document.querySelector('.workspace-paper')?.textContent||'';};});\n  await page.getByRole('button',{name:'Export',exact:true}).click();\n  await page.getByRole('menuitem',{name:'Print HTML preview',exact:true}).click();\n  assert((await page.evaluate(()=>window.__printText)).includes('Jordan Vale'));pass('HTML print still has document content after viewing a PDF');")
          Path('.github/workflows/regression-patch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/syntaxis/workspace.tsx scripts/verify-browser.mjs .github/workflows/regression-patch.yml
          git commit -m 'fix: preserve HTML print content and capture settled browser layouts'
          git push origin HEAD:feat/frontend-latex-verification
